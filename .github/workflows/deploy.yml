name: Deploy to Vercel

# Runs only after the CI workflow finishes successfully:
#   - push to main        -> production deployment
#   - pull request        -> preview deployment + PR comment with the URL
#   - manual (dispatch)   -> choose preview or production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59

jobs:
  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.event == 'push' && 'production' || 'preview') }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy only green CI runs from this repository (never from forks, which must not receive secrets).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
      # Never cancel a production deploy halfway; superseded previews can be cancelled.
      cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.event == 'push' && 'production' || 'preview') }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Resolve target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then env="$INPUT_ENV";
          elif [ "$RUN_EVENT" = "push" ]; then env="production";
          else env="preview"; fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          if [ "$env" = "production" ]; then echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"; else echo "prod_flag=" >> "$GITHUB_OUTPUT"; fi

      - name: Check Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set."; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit that passed CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to ${{ steps.target.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: steps.target.outputs.environment == 'preview' && github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // workflow_run doesn't always include the PR number, so look it up from the branch.
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${process.env.HEAD_BRANCH}` });
            const pr = prs[0];
            if (!pr) {
              core.info('No open pull request for this branch; skipping comment.');
              return;
            }
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Vercel preview** for \`${process.env.HEAD_SHA.slice(0, 7)}\`: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
